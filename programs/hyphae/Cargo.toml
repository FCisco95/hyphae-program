[package]
name = "hyphae"
version = "0.1.0"
description = "Hyphae: per-community SOL vault, epoch roots and one-time claims"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "hyphae"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "=1.0.1"
solana-sha256-hasher = { version = "3.1", features = ["sha2"] }

[dev-dependencies]
litesvm = "0.9.1"
serde_json = "1"
solana-account = "3"
solana-instruction-error = "2"
solana-keypair = "3"
solana-signer = "3"
solana-transaction = "3"
solana-transaction-error = "3"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
